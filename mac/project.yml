name: PhoneSignalSync
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.phonesignalsync.mac
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  PhoneSignalSync:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Phone Signal Sync
        LSUIElement: true
        NSLocalNetworkUsageDescription: Conecta ao celular na rede local para receber informações do sinal.
    settings:
      base:
        PRODUCT_NAME: PhoneSignalSync
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Generated/PhoneSignalSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
schemes:
  PhoneSignalSync:
    build:
      targets:
        PhoneSignalSync: all
    run:
      config: Debug
